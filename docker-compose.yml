services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: contract
    ports:
      - "3307:3306"
    volumes:
      - dbStorage:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql:ro

volumes:
  dbStorage:
